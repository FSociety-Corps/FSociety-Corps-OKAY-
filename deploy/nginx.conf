server {
    listen 80;
    listen [::]:80;
    server_name femboyfinder.lol www.femboyfinder.lol;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;

    server_name femboyfinder.lol www.femboyfinder.lol;

    ssl_certificate     /etc/ssl/cloudflare/femboyfinder.lol.pem;
    ssl_certificate_key /etc/ssl/cloudflare/femboyfinder.lol.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;

    include /etc/nginx/snippets/cloudflare.conf;

    client_max_body_size 1m;

    location / {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
