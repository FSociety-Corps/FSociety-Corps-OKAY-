<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>top larps</title>
  <link rel="icon" href="/favicon.ico">
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <header>
    <h1>top larps</h1>
    <p class="meta">
      <span id="guild">—</span>
      <span class="dot-sep">·</span>
      <b id="count">0</b> larpers
      <span class="dot-sep">·</span>
      updated <span id="ago">never</span>
    </p>
  </header>

  <div class="bar">
    <input id="q" placeholder="search" autocomplete="off" spellcheck="false">
    <div class="views">
      <button data-view="board" class="on">leaderboard</button>
      <button data-view="grid">grid</button>
    </div>
  </div>

  <main id="grid"></main>

  <footer id="status">connecting</footer>

  <script src="/app.js"></script>
</body>
</html>
