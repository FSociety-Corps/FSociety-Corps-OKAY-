<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>top larps</title>
  <link rel="icon" href="/favicon.ico">
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <header>
    <h1>top larps</h1>
    <p class="meta">
      <span id="guild">—</span>
      <span class="dot-sep">·</span>
      <b id="count">0</b> larpers
      <span class="dot-sep">·</span>
      updated <span id="ago">never</span>
    </p>
  </header>

  <div class="bar">
    <input id="q" placeholder="search" autocomplete="off" spellcheck="false">
    <div class="views">
      <button data-view="board" class="on">leaderboard</button>
      <button data-view="grid">grid</button>
    </div>
  </div>

  <main id="grid"></main>

  <div id="modal" hidden>
    <div class="sheet">
      <button class="close" aria-label="close">×</button>
      <div class="banner"></div>
      <div class="head">
        <div class="bigav">
          <img id="m-avatar" alt="">
          <img id="m-deco" class="deco" alt="" hidden>
          <span id="m-dot" class="dot"></span>
        </div>
        <div class="title">
          <h2 id="m-name"></h2>
          <div id="m-handle" class="tag"></div>
        </div>
      </div>
      <div class="body">
        <section id="m-activities"></section>
        <section id="m-roles" class="roles"></section>
        <section id="m-joined" class="joined-line"></section>
      </div>
    </div>
  </div>

  <footer id="status">connecting</footer>

  <script src="/app.js"></script>
</body>
</html>
